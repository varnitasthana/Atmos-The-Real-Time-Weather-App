name: Update daily weather news

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch weather news
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          query = urllib.parse.quote("weather OR climate OR forecast")
          url = f"https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en"
          request = urllib.request.Request(url, headers={"User-Agent": "AtmosWeather/1.0"})
          with urllib.request.urlopen(request, timeout=20) as response:
              root = ET.fromstring(response.read())

          items = []
          for item in root.findall("./channel/item")[:12]:
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").strip()
              published = (item.findtext("pubDate") or "").strip()
              source = item.find("source")
              if title and link:
                  items.append({
                      "source": source.text if source is not None and source.text else "Weather news",
                      "title": title,
                      "summary": "",
                      "published": published,
                      "url": link,
                      "image": "",
                  })

          payload = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "items": items,
          }
          with open("news.json", "w", encoding="utf-8") as target:
              json.dump(payload, target, ensure_ascii=False, indent=2)
          PY
      - name: Commit news if changed
        run: |
          git config user.name "Varnit Asthana"
          git config user.email "varnitasthanayt@gmail.com"
          git add news.json
          git diff --cached --quiet || git commit -m "chore: refresh live weather news"
          git push
